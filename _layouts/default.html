<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="liu.log · 系统软件学习与实践">
    <title>{{ page.title }} - liu.log</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-logo">
                <span class="logo-text">liu.log</span>
            </a>
            <nav class="site-nav">
                <a href="/" class="nav-link">首页</a>
                <a href="/about.html" class="nav-link">关于</a>
                <a href="/contact.html" class="nav-link">联系</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="content-wrapper{% if page.article %} technical-article{% endif %}{% if page.page_class %} {{ page.page_class }}{% endif %}">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-text">© 2026 liu.log · 系统软件学习与实践</p>
            <div class="footer-links">
                <a href="https://github.com/liulog" target="_blank" class="footer-link">GitHub</a>
                <span class="footer-divider">·</span>
                <a href="https://space.bilibili.com/1078937143" target="_blank" class="footer-link">Bilibili</a>
                <span class="footer-divider">·</span>
                <a href="mailto:liujingyu24s@ict.ac.cn" class="footer-link">Email</a>
            </div>
        </div>
    </footer>
</body>
</html>
